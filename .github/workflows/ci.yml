# Runs every test on every push (Phase 6.0). On main, a green run also publishes both Docker
# images to GitHub's container registry, tagged with the commit id and "latest".
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run that's still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers starts its own Postgres through the runner's Docker
      - run: ./mvnw -B test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds and starts the throwaway Docker stack (e2e/docker-compose.yml), then removes it
      - run: npm run e2e
      # Open a failure's trace with: npx playwright show-trace <trace.zip>
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14

  images:
    name: Publish images
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        part: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      # Registry paths must be lower case; the account name isn't
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/progression-tracker-${{ matrix.part }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.part }}
          push: true
          # One image per push; no separate provenance entries cluttering the package
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Links the package to this repository, so it inherits the repository's access
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.part }}
          cache-to: type=gha,mode=max,scope=${{ matrix.part }}
      # Keep the latest 10 versions of each image, within GitHub's free storage
      - uses: actions/delete-package-versions@v5
        with:
          package-name: progression-tracker-${{ matrix.part }}
          package-type: container
          min-versions-to-keep: 10
