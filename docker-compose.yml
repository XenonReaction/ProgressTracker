# Local development database only:   docker compose up -d
# Whole app (database, backend, UI):  docker compose --profile app up -d --build
#   then open http://localhost:8081
# The database login defaults to local-only values; POSTGRES_USER and POSTGRES_PASSWORD
# (for example in a git-ignored .env file) replace them for both the database and backend.
# Docker keeps each container's logs; cap them at 3 files of 10 MB
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:18
    logging: *logging
    container_name: progression-tracker-db
    environment:
      POSTGRES_DB: progressiontracker
      POSTGRES_USER: ${POSTGRES_USER:-progressiontracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-progressiontracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d progressiontracker"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    profiles: [app]
    build: ./backend
    logging: *logging
    container_name: progression-tracker-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/progressiontracker
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-progressiontracker}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-progressiontracker}
      # Set to "dev" to load the sample data into an empty database:
      #   SPRING_PROFILES_ACTIVE=dev docker compose --profile app up -d --build
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Healthy once /actuator/health reports UP, which includes reaching the database
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    # No published port: the frontend's nginx forwards /api here. That keeps port 8080
    # free for running the backend from the host with ./mvnw spring-boot:run.

  frontend:
    profiles: [app]
    build: ./frontend
    logging: *logging
    container_name: progression-tracker-frontend
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
