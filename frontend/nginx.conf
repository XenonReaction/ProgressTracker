# Used only by the Docker image. During development `npm start` does the same job
# with proxy.conf.json.
server {
    listen 80;
    root /usr/share/nginx/html;

    # API calls go to the backend container, so the browser sees one address (no CORS)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Angular routes such as /trees/1 are handled in the browser: serve index.html for them
    location / {
        try_files $uri $uri/ /index.html;
    }
}
