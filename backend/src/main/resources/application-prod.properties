# Production settings (Phase 6.1). Nothing runs with this profile yet; deployment is still
# to come (Phase_6_plan.md, "Deployment — to revisit").
#
# The database comes from SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and
# SPRING_DATASOURCE_PASSWORD, which ProductionSettingsCheck requires, so the local login in
# application.properties is never used. The dev sample data never loads with this profile.

# Logs are JSON in the Elastic Common Schema (ECS) format, one object per line, so a log tool
# can search them. The request id appears as the requestId field.
logging.structured.format.console=ecs
