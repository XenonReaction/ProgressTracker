spring.application.name=progression-tracker-backend

# Local development database (see docker-compose.yml at the repo root)
spring.datasource.url=jdbc:postgresql://localhost:5432/progressiontracker
spring.datasource.username=progressiontracker
spring.datasource.password=progressiontracker

# Keep database access inside the service layer, not during response rendering
spring.jpa.open-in-view=false
