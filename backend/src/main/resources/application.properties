spring.application.name=progression-tracker-backend

# Local development database (see docker-compose.yml at the repo root). Anywhere else, set
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD, which
# take precedence; the prod profile (application-prod.properties) requires them.
spring.datasource.url=jdbc:postgresql://localhost:5432/progressiontracker
spring.datasource.username=progressiontracker
spring.datasource.password=progressiontracker

# Keep database access inside the service layer, not during response rendering
spring.jpa.open-in-view=false

# Load lazy collections (a node's resources and tags, say) for up to 100 entities in one
# query, so lists and tree pages don't read them one entity at a time
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# The schema comes from the Flyway migrations in db/migration, which run on startup.
# Hibernate only checks that the entities match it, and refuses to start if they don't.
# A non-empty database without Flyway's history table is refused rather than adopted.
spring.jpa.hibernate.ddl-auto=validate

# Only the health endpoint is exposed: GET /actuator/health reports UP or DOWN, with the
# state of each check (such as the database) but none of their details. Docker's health
# checks use it.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always

# Logging (Phase 6.2): plain text, with each request's id (set by RequestLoggingFilter) after
# the thread name on every line logged while handling it. The prod profile switches to JSON.
# (%replace drops the empty [] on lines logged outside a request, such as at startup.)
logging.pattern.correlation=%replace([%X{requestId:-}] ){'^\\[\\] $', ''}

# v1 is single-user with no login: every API request acts as this user (created on first use)
progressiontracker.default-username=demo
